project:
  name: smart-traffic-control
  config_version: 1

runtime:
  mode: simulation
  observation_timeout_s: 3.0
  confirm_timeout_s: 10.0

queue_estimation:
  queue_speed_threshold_mps: 0.5
  vehicle_length_m: 5.0
  stopped_gap_m: 2.0
  stale_after_s: 3.0

optimization:
  max_wait_target_s: 130.0
  wait_urgency_start_s: 80.0
  wait_urgency_max_score: 5.0
  green_wave_score: 2.0
  demand:
    vehicle_weight: 0.6
    wait_weight: 0.4
    n_max: 20.0
  spillback:
    o_high: 0.8
    o_low: 0.5
    penalty: -1000.0
  score_hysteresis: 0.1
  switch_debounce_s: 3.0
  priorities:
    - wait_time_guarantee
    - downstream_spillback_prevention
    - main_road_green_wave
    - demand_score

signal:
  layout:
    mode: minor_only
    main_road_direction: null
  conflict_matrix:
    P_N: [P_E, P_S, P_W]
    P_E: [P_N, P_S, P_W]
    P_S: [P_N, P_E, P_W]
    P_W: [P_N, P_E, P_S]
  phases: []

green_wave:
  enabled: false
  main_through_phase: null
  band_start_s: 0.0
  band_end_s: 45.0
  period_s: 120.0

countdown:
  display_duration_s: 15.0

pedestrian:
  # 行人保底：某方向连续红灯达到 max_red_s(150s)，给一次保底绿灯让行人过街
  max_red_s: 150.0
  # 行人绿灯时长不拍脑袋：由「人行横道长度 / 步行速度 + 清空时间」推导，
  # min_green_s 只是「可接受下限」（推导值低于它时才用它兜底）。
  min_green_s: 12.0
  crosswalk_length_m: 15.0       # 人行横道长度（m），按实际路口标定
  walking_speed_mps: 1.2         # 行人步行速度（m/s），老人/儿童取 0.8~1.0
  clearance_s: 3.0               # 行人清空时间（s）
  # 车辆绿灯结束前 yellow_s 秒，人行横道转黄，禁止新行人进入
  yellow_s: 3.0

safety:
  require_config_validation: true
  reject_unknown_phases: true
  reject_stale_observations: true
