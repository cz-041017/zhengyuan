# 生产部署配置（骨架 / 占位）。
#
# 本文件是板子（RK3588）上 main.py 的入口配置。上线前必须逐项回填，
# 见各 TODO。决策层参数仍在 decision_config 指向的 YAML 里（沿用
# configs/default.yaml，其 phases 为空时走占位配时 SIM_*，见参数手册）。

# 决策层配置文件路径（相对仓库根）。
decision_config: configs/default.yaml

# 路口标识（日志 / 告警 / MQTT topic 都会用）。
junction_id: panan_1

# 控制回路周期（秒）。2 Hz（0.5s）。感知层按 ≥2Hz 写帧。
tick_period_s: 0.5

# 感知层写入的 JSON 快照（见 docs/perception-interface.md §8 生产接入）。
perception:
  input_path: /var/run/traffic-control/perception.json

# 信号机链路（软请求：只发相位指示）。
link:
  # 传输：serial | tcp | null。null = 离线冒烟，不接真机。
  transport:
    type: serial
    serial:
      port: /dev/ttyS0           # TODO: 海康信号机串口 / RS-485 转 USB 口
      baudrate: 9600             # TODO: 与信号机一致
      parity: none               # TODO: GB/T 20999-2017 注明校验位后回填
    tcp:
      host: 192.168.1.100        # TODO: 以太网口时回填
      port: 6000
  # 决策层相位 → 信号机相位编号 的映射（占位，见该文件 TODO）。
  phase_mapping: interface/hikvision/phase_mapping.yaml
  heartbeat:
    interval_s: 1.0
    timeout_s: 3.0
    max_missed: 3

# 指挥中心接管/摘除（占位：命令文件，跨进程方式待定）。
control_room:
  command_path: /var/run/traffic-control/control_command.json

# 启动序列结束后选定的首个绿灯相位（决策层不提议首相位）。
# 缺省取决策层第一个相位。
initial_phase: P_N

# 结构化运行日志（docs/logging-data-contract.md）。
logging:
  # 本地 JSONL 落盘目录（RK3588 上建议挂到数据分区）。
  directory: /var/log/traffic-control
  # 保留天数（2Hz × ~500B ≈ 86MB/天；30 天 ≈ 2.6GB）。
  retention_days: 30
  # 单个文件超过该字节数即轮转（50 MB）。
  max_bytes_per_file: 52428800
  # 溢出兜底：日志目录总字节数超限时从最旧轮转文件开始删除。
  # 建议设为日志分区容量的 80%，例如 64GB 分区 → 54975581388。null = 不启用。
  max_total_bytes: null
  # 黑匣子环形缓冲：保留最近 N 个 tick（2Hz 下 120 ≈ 60s），崩溃时 dump。
  black_box_ticks: 120
  # 云端上报（Phase 3：MQTT）。null = 不上传，仅本地落盘。
  # 接云端时改为如下结构（broker 地址 / 账号密码待上线前回填）：
  # cloud:
  #   type: mqtt
  #   host: mqtt.example.com      # TODO: MQTT broker 地址
  #   port: 8883                  # TLS 端口；无 TLS 用 1883
  #   username: traffic-control   # TODO: 鉴权用户名
  #   password: ""                # TODO: 鉴权密码（不要入库，用环境变量注入）
  #   tls: true
  #   qos: 1
  #   topic_prefix: traffic-control
  #   keepalive_s: 60
  #   max_queue: 10000
  cloud: null
